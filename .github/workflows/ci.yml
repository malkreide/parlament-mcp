name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # Pin ruff so an upstream release cannot change the default rule set or
      # formatter and break CI on unrelated, untouched code.
      - name: Install pinned ruff
        run: pip install ruff==0.16.1

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

  # Subnationaler Server (openparldata-mcp) – eigenständiges Subprojekt mit
      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  # Subnationaler Server (openparldata-mcp) – eigenständiges Subprojekt mit
  # eigener pyproject.toml. Separater Job, damit der Bundes-Server (Job "test")
  # unberührt bleibt.
  test-openparldata:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openparldata-mcp
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -m "not live"

      # Dieselbe Pinnung wie im Job "test". Ohne sie käme ruff aus dem dev-Extra
      # (`ruff>=0.4.0`), also in der jeweils neuesten Version — dieser Job wurde
      # damit ohne jede Codeänderung rot, sobald upstream eine Regel oder der
      # Formatter sich änderte.
      - name: Install pinned ruff
        run: pip install ruff==0.16.1

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/
