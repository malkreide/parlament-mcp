name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -m "not live"

      # Kein eigener ruff-Install mehr: `pip install -e ".[dev]"` oben bringt den
      # Pin aus pyproject mit. Der Schritt stand hier, lief nach dem Install und
      # gewann gegen pyproject — den Pin dort zu aendern haette in der CI nichts
      # bewirkt. Die Version steht jetzt nur an einer Stelle je Projekt.
      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/

  # Subnationaler Server (openparldata-mcp) – eigenständiges Subprojekt mit
      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  # Subnationaler Server (openparldata-mcp) – eigenständiges Subprojekt mit
  # eigener pyproject.toml. Separater Job, damit der Bundes-Server (Job "test")
  # unberührt bleibt.
  test-openparldata:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openparldata-mcp
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: PYTHONPATH=src pytest tests/ -m "not live"

      # Wie im Job "test" kein eigener ruff-Install mehr. Die Sorge, die hier
      # stand — ohne Pin käme ruff in der jeweils neuesten Version und der Job
      # würde ohne Codeänderung rot — ist damit nicht weg, sondern an die
      # richtige Stelle gewandert: `openparldata-mcp/pyproject.toml` pinnt jetzt
      # selbst, und der Install oben bringt diesen Pin mit.
      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: ruff format --check src/ tests/ scripts/
