name: Live API tests

# Live-Tests gegen die echten APIs (OPS-001, DRIFT-005). Bewusst nicht in CI bei
# jedem PR — nightly + manuell, damit API-Outages den Merge nicht blockieren.
#
# Ein Job pro Server: beide Quellen driften unabhängig voneinander, und ein
# Ausfall der einen soll den Befund der anderen nicht verdecken.
on:
  schedule:
    - cron: "0 4 * * *"  # täglich 04:00 UTC
  workflow_dispatch:

jobs:
  # Bundesebene: Curia Vista.
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run live tests
        run: PYTHONPATH=src pytest tests/ -m live

  # Subnationale Ebene: OpenParlData.ch.
  live-openparldata:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openparldata-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run live tests
        run: PYTHONPATH=src pytest tests/ -m live
