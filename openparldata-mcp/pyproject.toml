[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "openparldata-mcp"
version     = "0.1.0"
description = "MCP server for Swiss subnational parliaments (cantons & municipalities) via the OpenParlData.ch API"
readme      = "README.md"
license     = { file = "LICENSE" }
requires-python = ">=3.11"
authors     = [{ name = "malkreide" }]

keywords = [
    "mcp", "model-context-protocol", "swiss-open-data",
    "openparldata", "kantonsparlament", "gemeindeparlament",
    "subnational", "parlament", "vorstösse", "abstimmungen",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Migrated to the 2.x API (`mcp.server.mcpserver`); the previous `<2` bound
    # existed because 2.0.0 removed `mcp.server.fastmcp` outright. The bound
    # stays, now anchored at the other end: 3.0 may move the API again, and a
    # resolver should not make that decision silently either.
    #
    # 2.x is not merely a rename. Two things bite at runtime, both handled in
    # `server.py`: `mcp.settings` is read-only (host/port are `run()` kwargs
    # now), and `host` is an app-level argument the SDK derives its
    # DNS-rebinding allow-list from — omitting it means HTTP 421.
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
openparldata-mcp = "openparldata_mcp.server:main"

[project.urls]
Homepage   = "https://github.com/malkreide/openparldata-mcp"
Repository = "https://github.com/malkreide/openparldata-mcp"
Issues     = "https://github.com/malkreide/openparldata-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/openparldata_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers      = [
    "live: live API tests (skipped in CI by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
